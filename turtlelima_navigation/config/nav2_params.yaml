# Nav2 parameters for turtlelima (Create 3 base, RealSense, ROS 2 Jazzy).
#
# Localization is odometry only: no AMCL, no map_server. The Create 3 publishes
# odom -> base_link, so `odom` is the global frame of every node and both
# costmaps are rolling windows around the robot.
#
# Costmap layers:
#   voxel_layer     geometry from the local RealSense cloud (never crosses the network)
#   semantic_layer  class masks returned by the segmentation server
# Both can be switched off from navigation.launch.py
# (use_voxel_layer:=false / use_semantic_layer:=false).

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom_reliable
    transform_tolerance: 0.1
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Empty = Nav2's default behavior trees
    # (navigate_to_pose_w_replanning_and_recovery.xml and friends).
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    odom_topic: /odom_reliable
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      time_steps: 56
      model_dt: 0.05
      # Lower than Nav2's default (2000) to leave headroom on the Jetson.
      batch_size: 1000
      iteration_count: 1
      # Create 3 limits (hardware max is ~0.306 m/s).
      vx_max: 0.26
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      az_max: 2.0
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      # Must stay below half the local costmap width (3.0 m / 2).
      prune_distance: 1.2
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # Circular robot (robot_radius), so the center point check is enough.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["voxel_layer", "semantic_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/realsense/depth/color/points
          data_type: "PointCloud2"
          # Above floor noise, below the top of the voxel column (16 * 0.05 m).
          min_obstacle_height: 0.05
          max_obstacle_height: 0.8
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5

      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        observation_sources: camera
        camera:
          # TODO: once cloud_resync exists, point these at /semnav/{mask,confidence,points}.
          # The spec forbids reading the raw server mask in the final setup.
          segmentation_topic: /mask
          confidence_topic: /confidence
          labels_topic: /label_info
          pointcloud_topic: /camera/realsense/depth/color/points
          # Experimental factors (see docs/SPECIFICATION_1.md).
          observation_persistence: 0.0
          tile_map_decay_time: 5.0
          expected_update_rate: 0.0
          visualize_tile_map: false
          use_cost_selection: false
          min_obstacle_distance: 0.3
          max_obstacle_distance: 4.0
          # Class names must match turtlelima_segmentation/config/classes.yaml.
          class_types: ["traversable", "danger"]
          traversable:
            classes: ["floor"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 0
            dominant_priority: false
          danger:
            classes: ["wall", "obstacle"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 0
            samples_to_max_cost: 0
            dominant_priority: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      update_frequency: 1.0
      publish_frequency: 1.0
      # No map: the global costmap is a large window that follows the robot.
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      track_unknown_space: false
      robot_radius: 0.18
      plugins: ["voxel_layer", "semantic_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/realsense/depth/color/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 0.8
          marking: true
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5

      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        observation_sources: camera
        camera:
          segmentation_topic: /mask
          confidence_topic: /confidence
          labels_topic: /label_info
          pointcloud_topic: /camera/realsense/depth/color/points
          observation_persistence: 0.0
          tile_map_decay_time: 5.0
          expected_update_rate: 0.0
          visualize_tile_map: false
          use_cost_selection: false
          min_obstacle_distance: 0.3
          max_obstacle_distance: 4.0
          class_types: ["traversable", "danger"]
          traversable:
            classes: ["floor"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 0
            dominant_priority: false
          danger:
            classes: ["wall", "obstacle"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 0
            samples_to_max_cost: 0
            dominant_priority: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odom_reliable
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
